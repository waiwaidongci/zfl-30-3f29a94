<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>水下考古潜水记录</h1>
      <div class="muted">点击沉船平面图添加标记，管理潜次档案，筛选、编辑、导出JSON。</div>
    </div>
    <div class="header-buttons">
      <div class="project-selector">
        <select id="projectSelect"></select>
        <button type="button" id="manageProjectBtn" class="secondary" title="项目管理">管理项目</button>
      </div>
      <div class="toolbar-divider"></div>
      <button id="importBtn" class="secondary">导入JSON</button>
      <button id="importCSVBtn" class="secondary">导入CSV</button>
      <button id="exportBtn">导出JSON</button>
      <button id="reportBtn" class="secondary">现场报告</button>
    </div>
  </header>
  <main class="app">
    <section class="panel">
      <div class="map-toolbar">
        <select id="diveFilter">
          <option value="">全部潜次</option>
        </select>
        <select id="filter">
          <option value="">全部类型</option>
          <option value="ceramic">陶片</option>
          <option value="wood">木构件</option>
          <option value="metal">金属件</option>
          <option value="unknown">未知物</option>
        </select>
        <select id="reviewFilter">
          <option value="">全部状态</option>
          <option value="collected">采集</option>
          <option value="pending">待复核</option>
          <option value="confirmed">已确认</option>
          <option value="revisit">需返潜</option>
        </select>
        <div class="toolbar-divider"></div>
        <button type="button" id="calibrateBtn" class="secondary">校准比例尺</button>
        <button type="button" id="gridBtn" class="secondary">显示网格</button>
        <button type="button" id="measureBtn" class="secondary">开始测距</button>
        <button type="button" id="heatmapBtn" class="secondary">热力图</button>
        <span class="stats" id="mapStats"></span>
      </div>
      <div class="map" id="map">
        <div class="wreck"></div>
        <svg class="grid-layer" id="gridLayer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <svg class="measure-layer" id="measureLayer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <canvas class="heatmap-canvas" id="heatmapCanvas"></canvas>
        <div class="heatmap-controls hidden" id="heatmapControls">
          <div class="heatmap-control-row">
            <span class="heatmap-control-label">分组</span>
            <select id="heatmapFilter">
              <option value="all">全部标记</option>
              <optgroup label="按类型">
                <option value="type_ceramic">陶片</option>
                <option value="type_wood">木构件</option>
                <option value="type_metal">金属件</option>
                <option value="type_unknown">未知物</option>
              </optgroup>
              <optgroup label="按审核状态">
                <option value="status_collected">采集</option>
                <option value="status_pending">待复核</option>
                <option value="status_confirmed">已确认</option>
                <option value="status_revisit">需返潜</option>
              </optgroup>
            </select>
          </div>
          <div class="heatmap-control-row">
            <span class="heatmap-control-label">透明度</span>
            <input type="range" class="heatmap-opacity-slider" id="heatmapOpacity" min="0" max="100" value="55">
            <span class="heatmap-opacity-value" id="heatmapOpacityValue">55%</span>
          </div>
          <div class="heatmap-legend">
            <span class="heatmap-legend-label">低</span>
            <div class="heatmap-legend-bar" id="heatmapLegendBar"></div>
            <span class="heatmap-legend-label">高</span>
          </div>
        </div>
        <div class="heatmap-empty-tip hidden" id="heatmapEmptyTip">当前筛选条件下无标记数据</div>
      </div>
    </section>
    <aside class="panel">
      <div class="tabs">
        <button class="tab active" data-tab="marks">标记管理</button>
        <button class="tab" data-tab="review">审核看板</button>
        <button class="tab" data-tab="dives">潜次档案</button>
        <button class="tab" data-tab="measure">测距与网格</button>
      </div>

      <div id="marksTab" class="tab-content">
        <div class="toolbar">
          <select id="view">
            <option value="list">标记列表</option>
            <option value="timeline">潜次时间线</option>
          </select>
        </div>
        <form id="form">
          <h2>标记信息</h2>
          <input name="id" type="hidden">
          <label>编号</label><input name="code" required>
          <label>类型</label>
          <select name="type">
            <option value="ceramic">陶片</option>
            <option value="wood">木构件</option>
            <option value="metal">金属件</option>
            <option value="unknown">未知物</option>
          </select>
          <label>潜次</label>
          <select name="dive" required>
            <option value="">请选择潜次</option>
          </select>
          <label>深度</label><input name="depth" placeholder="例如18.4m" required>
          <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
          <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
          <label>备注</label><textarea name="note"></textarea>

          <div class="review-section">
            <div class="review-header">
              <h2>审核信息</h2>
            </div>
            <label>审核状态</label>
            <select name="reviewStatus">
              <option value="collected">采集</option>
              <option value="pending">待复核</option>
              <option value="confirmed">已确认</option>
              <option value="revisit">需返潜</option>
            </select>
            <label>复核意见</label>
            <textarea name="reviewComment" placeholder="填写复核意见或返潜说明..."></textarea>
            <label>审核人</label>
            <input name="reviewer" placeholder="例如：李教授">
          </div>

          <div class="attachments-section">
            <div class="attachments-header">
              <h2>影像证据</h2>
              <button type="button" id="addAttachmentBtn" class="secondary">添加图片</button>
            </div>
            <div class="storage-info" id="storageInfo"></div>
            <div id="attachmentsList" class="attachments-list"></div>
            <div id="attachmentsEmpty" class="attachments-empty">
              <div class="empty-icon">📷</div>
              <div class="muted">暂无影像证据</div>
              <div class="muted small">点击"添加图片"按钮上传现场照片</div>
            </div>
          </div>

          <div class="toolbar">
            <button>保存标记</button>
            <button type="button" id="deleteBtn" class="secondary">删除</button>
          </div>
        </form>
        <h2 id="listTitle">标记列表</h2>
        <div id="list" class="list"></div>
      </div>

      <div id="divesTab" class="tab-content hidden">
        <div class="dive-stats" id="diveStats"></div>
        <form id="diveForm">
          <h2>潜次档案</h2>
          <input name="id" type="hidden">
          <label>潜次编号</label><input name="code" placeholder="例如DIVE-01" required>
          <label>下潜日期</label><input name="date" type="date" required>
          <label>负责人</label><input name="leader" placeholder="例如张教授" required>
          <label>天气</label>
          <select name="weather">
            <option value="sunny">晴</option>
            <option value="cloudy">多云</option>
            <option value="rainy">雨</option>
            <option value="windy">大风</option>
            <option value="foggy">雾</option>
          </select>
          <label>水流</label>
          <select name="current">
            <option value="calm">无流</option>
            <option value="weak">弱流</option>
            <option value="moderate">中流</option>
            <option value="strong">强流</option>
          </select>
          <label>能见度</label><input name="visibility" placeholder="例如5-8米" required>
          <label>任务目标</label><textarea name="objective" placeholder="例如勘查船艉区域，采集陶瓷标本" required></textarea>
          <div class="toolbar">
            <button>保存潜次</button>
            <button type="button" id="deleteDiveBtn" class="secondary">删除</button>
          </div>
        </form>
        <h2>潜次列表</h2>
        <div id="diveList" class="dive-list"></div>
        <div id="diveDetail" class="dive-detail hidden">
          <h2>潜次详情</h2>
          <div id="diveDetailContent"></div>
        </div>
      </div>

      <div id="reviewTab" class="tab-content hidden">
        <div class="review-stats" id="reviewStats"></div>
        <div class="review-toolbar">
          <select id="reviewDiveFilter">
            <option value="">全部潜次</option>
          </select>
          <select id="reviewTypeFilter">
            <option value="">全部类型</option>
            <option value="ceramic">陶片</option>
            <option value="wood">木构件</option>
            <option value="metal">金属件</option>
            <option value="unknown">未知物</option>
          </select>
        </div>
        <div class="review-board" id="reviewBoard">
          <div class="review-column" data-status="collected" ondrop="handleKanbanDrop(event, 'collected')" ondragover="handleKanbanDragOver(event)">
            <div class="review-column-header status-collected">
              <span class="status-dot"></span>
              <h3>采集</h3>
              <span class="review-count" id="count-collected">0</span>
            </div>
            <div class="review-cards" id="cards-collected"></div>
          </div>
          <div class="review-column" data-status="pending" ondrop="handleKanbanDrop(event, 'pending')" ondragover="handleKanbanDragOver(event)">
            <div class="review-column-header status-pending">
              <span class="status-dot"></span>
              <h3>待复核</h3>
              <span class="review-count" id="count-pending">0</span>
            </div>
            <div class="review-cards" id="cards-pending"></div>
          </div>
          <div class="review-column" data-status="confirmed" ondrop="handleKanbanDrop(event, 'confirmed')" ondragover="handleKanbanDragOver(event)">
            <div class="review-column-header status-confirmed">
              <span class="status-dot"></span>
              <h3>已确认</h3>
              <span class="review-count" id="count-confirmed">0</span>
            </div>
            <div class="review-cards" id="cards-confirmed"></div>
          </div>
          <div class="review-column" data-status="revisit" ondrop="handleKanbanDrop(event, 'revisit')" ondragover="handleKanbanDragOver(event)">
            <div class="review-column-header status-revisit">
              <span class="status-dot"></span>
              <h3>需返潜</h3>
              <span class="review-count" id="count-revisit">0</span>
            </div>
            <div class="review-cards" id="cards-revisit"></div>
          </div>
        </div>
        <div class="review-detail hidden" id="reviewDetail">
          <div class="review-detail-header">
            <h3 id="reviewDetailTitle">标记详情</h3>
            <button type="button" id="closeReviewDetail" class="secondary small">关闭</button>
          </div>
          <div id="reviewDetailContent"></div>
        </div>
      </div>

      <div id="measureTab" class="tab-content hidden">
        <div class="measure-stats" id="measureStats"></div>
        <div class="scale-info" id="scaleInfo">
          <span class="muted">当前比例尺：</span>
          <span id="scaleValue">未校准</span>
        </div>
        <form id="measureForm">
          <h2>测距信息</h2>
          <input name="id" type="hidden">
          <label>编号</label><input name="code" required>
          <label>所属潜次</label>
          <select name="dive" required>
            <option value="">请选择潜次</option>
          </select>
          <label>长度（米）</label><input name="length" type="number" step="0.01" placeholder="自动计算" readonly>
          <label>关联标记</label>
          <div id="relatedMarksContainer" class="related-marks"></div>
          <label>备注</label><textarea name="note" placeholder="测量说明或特殊记录"></textarea>
          <div class="toolbar">
            <button>保存测距</button>
            <button type="button" id="deleteMeasureBtn" class="secondary">删除</button>
            <button type="button" id="cancelMeasureBtn" class="secondary">取消</button>
          </div>
        </form>
        <div class="grid-config">
          <h2>网格配置</h2>
          <div class="grid-config-row">
            <label>网格大小（米）</label>
            <input type="number" id="gridSize" value="1" min="0.1" step="0.1">
          </div>
          <div class="grid-config-row">
            <label>显示坐标标签</label>
            <label class="checkbox-label">
              <input type="checkbox" id="showGridLabels" checked>
              <span>启用</span>
            </label>
          </div>
        </div>
        <h2>测距记录</h2>
        <div id="measureList" class="measure-list"></div>
      </div>
    </aside>
  </main>
  <script src="js/projectManager.js"></script>
  <script src="js/dataIO.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/heatmap.js"></script>
  <script src="js/report.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
