<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>水下考古潜水记录</h1>
      <div class="muted">点击沉船平面图添加标记，筛选、编辑、导出JSON，或从现场设备导入历史标记。</div>
    </div>
    <div class="header-buttons">
      <button id="importBtn" class="secondary">导入JSON</button>
      <button id="exportBtn">导出JSON</button>
    </div>
  </header>
  <main class="app">
    <section class="panel">
      <div class="map" id="map"><div class="wreck"></div></div>
    </section>
    <aside class="panel">
      <div class="toolbar">
        <select id="filter">
          <option value="">全部类型</option>
          <option value="ceramic">陶片</option>
          <option value="wood">木构件</option>
          <option value="metal">金属件</option>
          <option value="unknown">未知物</option>
        </select>
        <select id="view">
          <option value="list">标记列表</option>
          <option value="timeline">潜次时间线</option>
        </select>
      </div>
      <form id="form">
        <h2>标记信息</h2>
        <input name="id" type="hidden">
        <label>编号</label><input name="code" required>
        <label>类型</label>
        <select name="type">
          <option value="ceramic">陶片</option>
          <option value="wood">木构件</option>
          <option value="metal">金属件</option>
          <option value="unknown">未知物</option>
        </select>
        <label>潜次</label><input name="dive" placeholder="例如DIVE-04" required>
        <label>深度</label><input name="depth" placeholder="例如18.4m" required>
        <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
        <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
        <label>备注</label><textarea name="note"></textarea>
        <div class="toolbar">
          <button>保存标记</button>
          <button type="button" id="deleteBtn" class="secondary">删除</button>
        </div>
      </form>
      <h2 id="listTitle">标记列表</h2>
      <div id="list" class="list"></div>
    </aside>
  </main>
  <script src="js/dataIO.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
